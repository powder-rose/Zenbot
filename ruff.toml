# Shared rules for new tests and development tools.
# The gate explicitly uses E9,F63,F7,F82 for existing application code.
target-version = "py312"
line-length = 88
fix = false
force-exclude = true
extend-exclude = ["data", "venv", ".venv", "test"]

[lint]
select = ["E4", "E7", "E9", "F", "UP", "BLE"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
